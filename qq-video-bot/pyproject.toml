[project]
name = "qq-video-bot"
version = "0.1.0"
description = "QQ group Bilibili and Douyin link resolver bot"
requires-python = ">=3.10,<3.15"
dependencies = [
    "nonebot2[fastapi]>=2.5.0,<3.0.0",
    "nonebot-adapter-onebot>=2.4.6,<3.0.0",
    "nonebot-plugin-parser==2.6.7",
]

[tool.uv]
package = false

[tool.uv.sources]
nonebot-plugin-parser = { path = "../nonebot-plugin-parser", editable = true }

[tool.nonebot]
plugins = ["nonebot_plugin_parser"]
plugin_dirs = []
builtin_plugins = []
